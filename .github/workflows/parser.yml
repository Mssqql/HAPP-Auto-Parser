
name: HAPP Auto Parser

on:
  workflow_dispatch:
  schedule:
   schedule:
  - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run parser
        run: python main.py

      - name: Publish result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update HAPP parser result"
            git push
          fi

