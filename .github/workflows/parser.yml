
name: HAPP Auto Parser

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run parser
        run: python main.py

      - name: Save result
        uses: actions/upload-artifact@v4
        with:
          name: HAPP-Parser-Result
          path: result.txt
          if-no-files-found: warn
